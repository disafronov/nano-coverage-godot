name: Tests

on:
  push:
    branches:
      - 'fix/**'
      - local
  pull_request:
    branches:
      - local
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: C++ and GdUnit4 (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare dependencies and Godot
        run: python scripts/setup.py

      - name: Run C++ and GdUnit4 tests
        run: python scripts/test.py
