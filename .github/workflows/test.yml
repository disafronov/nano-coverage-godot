name: Tests

on:
  pull_request:
    branches:
      - local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: C++ and GdUnit4 (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache SCons build outputs
        uses: actions/cache@v5
        with:
          path: .scons_cache/
          key: ${{ runner.os }}-ubuntu-22.04-scons-tests-${{ hashFiles('SConstruct', 'SConscript', '**/SConscript', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-22.04-scons-tests-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prepare dependencies and Godot
        run: python scripts/setup.py

      - name: Make downloaded Godot executable
        run: chmod +x Godot_v4.5-stable_linux.x86_64

      - name: Install virtual X11 display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run C++ and GdUnit4 tests
        id: tests
        env:
          SCONS_CACHE: .scons_cache
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python scripts/test.py 2>&1 | tee "$RUNNER_TEMP/nanocoverage-tests.log"

      - name: Build release-mode Linux libraries
        shell: bash
        env:
          SCONS_CACHE: .scons_cache
        run: |
          set -euo pipefail
          scons platform=linux target=editor build_tests=no cache_path=.scons_cache/
          scons platform=linux target=template_debug build_tests=no cache_path=.scons_cache/

      - name: Check release-mode Linux ABI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          limits = {"GLIBC": (2, 35), "GLIBCXX": (3, 4, 30), "CXXABI": (1, 3, 13)}
          binaries = [
              Path("demo/addons/nano_coverage_godot/bin/nano_coverage_godot.linux.editor.x86_64.so"),
              Path("demo/addons/nano_coverage_godot/bin/nano_coverage_godot.linux.template_debug.x86_64.so"),
          ]
          for binary in binaries:
              if not binary.is_file():
                  raise SystemExit(f"Missing release binary: {binary}")
              output = subprocess.check_output(["readelf", "--version-info", str(binary)], text=True)
              for family, limit in limits.items():
                  versions = [
                      tuple(map(int, match.split(".")))
                      for match in re.findall(r"\b" + family + r"_(\d+(?:\.\d+)+)\b", output)
                  ]
                  if not versions:
                      print(f"{binary}: no {family} version requirements")
                      continue
                  maximum = max(versions)
                  print(f"{binary}: {family} max {maximum}, allowed <= {limit}")
                  if maximum > limit:
                      raise SystemExit(f"{binary} requires {family}_{'.'.join(map(str, maximum))}")
          PY

      - name: Verify release-mode GDExtension loads in Godot
        shell: bash
        run: |
          set -euo pipefail
          cat > demo/nano_release_smoke_ci.gd <<'EOF'
          extends SceneTree

          func _initialize() -> void:
              if not ClassDB.class_exists("CoverageApi"):
                  push_error("Release GDExtension did not register CoverageApi")
                  quit(1)
                  return
              var api: Object = ClassDB.instantiate("CoverageApi")
              if api == null:
                  push_error("Could not instantiate CoverageApi")
                  quit(1)
                  return
              print("Release GDExtension loaded successfully")
              quit(0)
          EOF
          trap 'rm -f demo/nano_release_smoke_ci.gd' EXIT
          ./Godot_v4.5-stable_linux.x86_64 --headless --path demo --script res://nano_release_smoke_ci.gd

      - name: Upload test and coverage reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            demo/reports/
            demo/coverage-report/
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
          TEST_LOG: ${{ runner.temp }}/nanocoverage-tests.log
        run: python scripts/ci_summary.py
