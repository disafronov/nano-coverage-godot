name: Tests

on:
  pull_request:
    branches:
      - local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: C++ and GdUnit4 (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache SCons build outputs
        uses: actions/cache@v5
        with:
          path: .scons_cache/
          key: ${{ runner.os }}-scons-tests-${{ hashFiles('SConstruct', 'SConscript', '**/SConscript', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-scons-tests-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prepare dependencies and Godot
        run: python scripts/setup.py

      - name: Make downloaded Godot executable
        run: chmod +x Godot_v4.5-stable_linux.x86_64

      - name: Install virtual X11 display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run C++ and GdUnit4 tests
        env:
          SCONS_CACHE: .scons_cache
        run: xvfb-run -a python scripts/test.py

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            demo/reports/
            demo/coverage-report/
          if-no-files-found: warn
