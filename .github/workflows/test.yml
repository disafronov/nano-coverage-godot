name: Tests

on:
  pull_request:
    branches:
      - local
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: C++ and GdUnit4 (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache SCons build outputs
        uses: actions/cache@v6
        with:
          path: .scons_cache/
          key: ${{ runner.os }}-${{ runner.arch }}-scons-tests-${{ hashFiles('SConstruct', '.gitmodules') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-scons-tests-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/test.yml

      - name: Prepare dependencies and Godot
        run: python scripts/setup.py

      - name: Make downloaded Godot executable
        run: chmod +x Godot_v4.5-stable_linux.x86_64

      - name: Install virtual X11 display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Run C++ and GdUnit4 tests
        id: tests
        env:
          SCONS_CACHE: .scons_cache
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a python scripts/test.py 2>&1 | tee "$RUNNER_TEMP/nanocoverage-tests.log"

      - name: Upload test and coverage reports
        id: reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            demo/reports/
            demo/coverage-report/
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
          TEST_LOG: ${{ runner.temp }}/nanocoverage-tests.log
        run: python scripts/ci_summary.py
