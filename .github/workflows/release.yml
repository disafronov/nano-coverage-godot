name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: .scons_cache/
          key: ${{ matrix.platform }}-${{ matrix.runner }}-release-${{ github.sha }}
          restore-keys: |
            ${{ matrix.platform }}-${{ matrix.runner }}-release-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      # COMPILE

      - name: Compile (Linux/Windows)
        if: ${{ matrix.platform != 'macos' }}
        # Windows runner auto-detects MSVC. Linux runner auto-detects GCC.
        run: |
          scons platform=${{ matrix.platform }} target=editor build_tests=no cache_path=.scons_cache/
          scons platform=${{ matrix.platform }} target=template_debug build_tests=no cache_path=.scons_cache/

      - name: Compile (MacOS)
        if: ${{ matrix.platform == 'macos' }}
        run: |
          scons platform=macos arch=x86_64 target=editor build_tests=no cache_path=.scons_cache/
          scons platform=macos arch=x86_64 target=template_debug build_tests=no cache_path=.scons_cache/
          scons platform=macos arch=arm64 target=editor build_tests=no cache_path=.scons_cache/
          scons platform=macos arch=arm64 target=template_debug build_tests=no cache_path=.scons_cache/

      - name: Set up Godot for Linux release smoke test
        if: matrix.platform == 'linux'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.0"
          use-dotnet: false
          include-templates: false

      - name: Validate Linux binary ABI
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          limits = {"GLIBC": (2, 35), "GLIBCXX": (3, 4, 30), "CXXABI": (1, 3, 13)}
          binaries = sorted(Path("demo/addons/nano_coverage_godot/bin").glob("*linux*.so"))
          if len(binaries) != 2:
              raise SystemExit(f"Expected 2 Linux libraries, found {len(binaries)}: {binaries}")
          for binary in binaries:
              output = subprocess.check_output(["readelf", "--version-info", str(binary)], text=True)
              for family, limit in limits.items():
                  versions = [tuple(map(int, match.split("."))) for match in
                              re.findall(r"\b" + family + r"_(\d+(?:\.\d+)+)\b", output)]
                  maximum = max(versions, default=None)
                  print(f"{binary}: {family} max {maximum}, allowed <= {limit}")
                  if maximum and maximum > limit:
                      raise SystemExit(f"{binary} requires {family}_{'.'.join(map(str, maximum))}")
          PY

      - name: Verify Linux GDExtension loads in Godot
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nano-smoke/addons"
          cp -a demo/addons/nano_coverage_godot "$RUNNER_TEMP/nano-smoke/addons/"
          printf 'config_version=5\n' > "$RUNNER_TEMP/nano-smoke/project.godot"
          cat > "$RUNNER_TEMP/nano-smoke/smoke.gd" <<'EOF'
          extends SceneTree
          func _initialize() -> void:
              var api = CoverageApi.new()
              if api == null:
                  quit(1)
                  return
              print("Nano Coverage release GDExtension loaded")
              quit(0)
          EOF
          godot --headless --path "$RUNNER_TEMP/nano-smoke" --script "$RUNNER_TEMP/nano-smoke/smoke.gd"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.platform }}
          path: demo/addons/nano_coverage_godot/bin/

  package:
    name: Package & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble & Zip
        run: |
          mkdir -p demo/addons/nano_coverage_godot/bin
          
          # Copy binaries
          cp -r artifacts/lib-linux/* demo/addons/nano_coverage_godot/bin/
          cp -r artifacts/lib-windows/* demo/addons/nano_coverage_godot/bin/
          cp -r artifacts/lib-macos/* demo/addons/nano_coverage_godot/bin/

          # Cleanup any temp build files
          rm -f demo/addons/nano_coverage_godot/bin/*.exp
          rm -f demo/addons/nano_coverage_godot/bin/*.lib
          rm -f demo/addons/nano_coverage_godot/bin/*.pdb

          # Zip
          cd demo
          zip -r ../nano_coverage_godot_${{ inputs.version }}.zip addons/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version }}
          name: NanoCoverage ${{ inputs.version }}
          draft: true
          files: nano_coverage_godot_${{ inputs.version }}.zip
          generate_release_notes: true